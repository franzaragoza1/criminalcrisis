name: Promo drip

# Render's free tier has no cron and sleeps the service after inactivity, so the
# send queue is driven from here. The ping also wakes the API, which means the
# first real visitor after a send isn't the one paying the cold-start cost.
#
# Required repository secrets:
#   PROMO_API_URL      e.g. https://criminalcrisis.onrender.com
#   PROMO_CRON_SECRET  must match the env var of the same name on Render

on:
  schedule:
    # Every 10 minutes, not hourly. Render's free tier sleeps after 15 minutes
    # idle, and a sleeping instance takes ~50s to wake — longer than Svix waits
    # before giving up on a webhook. During the first send that cost us 75 of
    # 100 delivery confirmations. Draining is a no-op once the daily cap is hit,
    # so the extra runs exist purely to keep the service awake for Resend.
    # The repo is public, so Actions minutes are free.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max emails to send in this run (defaults to the daily cap)'
        required: false
        type: string

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Drain the promo send queue
        env:
          API_URL: ${{ secrets.PROMO_API_URL }}
          CRON_SECRET: ${{ secrets.PROMO_CRON_SECRET }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::PROMO_API_URL and PROMO_CRON_SECRET repository secrets must be set."
            exit 1
          fi

          body='{}'
          if [ -n "$LIMIT" ]; then body="{\"limit\":$LIMIT}"; fi

          # Render cold starts can take ~50s, so allow a generous timeout and retry once.
          response=$(curl --silent --show-error --fail-with-body \
            --max-time 180 --retry 2 --retry-delay 30 --retry-connrefused \
            -X POST "$API_URL/api/promo/queue/drain" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d "$body")

          echo "$response"
          echo "### Promo drip" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$response" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
