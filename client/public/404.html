<!doctype html>
<!--
  Vercel serves this file, with a real 404 status, for any path that matches
  neither a static file nor a rewrite in vercel.json.

  That makes vercel.json's rewrite list load-bearing: it enumerates the routes
  declared in src/App.tsx, because a catch-all would send made-up URLs to
  index.html and answer 200 with the React not-found screen — a soft 404, which
  Google indexes as a real page. Add a route to App.tsx and it has to be added
  to vercel.json too, or it will land here instead.

  (The note lives here because vercel.json is validated against a strict schema
  that rejects unknown keys, so it cannot carry a comment of its own.)

  The React NotFound component still exists and still handles navigation that
  happens inside the already-loaded app; this file is only for the first hit.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Criminal Crisis</title>
<!-- Served with a real 404 status, so this must never be indexed. -->
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/img/logos/logotipo5_criminalCrisis@2x.png">
<style>
@font-face {
  font-family: 'ABCCamera';
  src: url('/fonts/ABCCameraPlain-Bold-Trial.otf') format('opentype');
  font-weight: 400 900;
  font-style: normal;
  font-display: swap;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 1.5rem;
  background: #FAFAFA;
  color: #111111;
  font-family: 'ABCCamera', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  letter-spacing: -0.04em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-align: center;
}
.eyebrow {
  margin: 0 0 1rem;
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #C0BABC;
}
h1 {
  margin: 0 0 1.5rem;
  font-size: 2.25rem;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.01em;
  text-transform: uppercase;
}
@media (min-width: 48em) { h1 { font-size: 3rem; } }
a {
  display: inline-block;
  padding-bottom: 0.125rem;
  border-bottom: 1px solid #111111;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #111111;
  text-decoration: none;
  transition: color 0.15s ease, border-color 0.15s ease;
}
a:hover, a:focus-visible { color: #C8302B; border-color: #C8302B; }
:focus-visible { outline: 2px solid #C8302B; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Error 404</p>
    <h1>Page not found</h1>
    <a href="/">Back to criminalcrisis.com</a>
  </main>
</body>
</html>
